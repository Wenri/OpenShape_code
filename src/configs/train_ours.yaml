project_name: 3D_CLIP
clip_embed_dim: 1280
clip_embed_version: OpenCLIP
model:
  name: PointBERT 
  scaling: 4
  in_channel: 6
  out_channel: ${clip_embed_dim}
  embedding_channel: 1024
  proj_dim: 1280
  voxel_size: 0.02
  use_dense: True

training:
  use_text_token_interaction: true     # turn on tuple return + local loss
  filip_keep_ratio_p: 0.25   # keep ratio for 3D patch tokens (P)
  filip_keep_ratio_t: 0.75   # keep ratio for text tokens (T)
  lambda_text_token_interaction: 1   # weight of the local loss
  sparc_lambda: 0.1
  sparc_eps: 1e-6
  global_lambda: 1.0
  sparc_sigma: 0.25
  sparc_topk: 8
  use_sparc_local: True
  max_text_tokens: 33     
  use_openclip_optimizer_scheduler: False
  lr: 0.0005
  lr_decay_step: 10000
  lr_decay_rate: 0.967
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  warmup: 10000
  max_epoch: 1000
  log_freq: 10
  save_freq: 20
  lambda_img_contras: 1
  lambda_text_contras: 1
  use_image_proj: False 
  use_text_proj: False
  logit_scale_init: 14.28
  use_mask: False
  mask_threshold: 0.1

dataset:
  name: FourNPZ_text_tokens
  train_split: /mnt/disk1/souhail_data/meta_data/split/train_no_lvis.json
  text_tok_root: /mnt/disk2/souhail_data/tokfeat_out_text
  image_tok_root: /mnt/disk6/souhail_data/tokfeat_out_image
  train_partial: -1
  num_points: 10000 
  num_workers: 18
  train_batch_size: 168
  use_knn_negative_sample: False
  negative_sample_num: 1
  knn_path: /mnt/disk1/souhail_data/meta_data/point_feat_knn.npy
  y_up: True
  normalize: True
  random_z_rotate: True
  use_color: True
  rgb_random_drop_prob: 0.5
  augment: True
  text_source: [text, caption, retrieval_text] 
  use_text_filtering: True
  use_prompt_engineering: False
  gpt4_filtering_path: /mnt/disk1/souhail_data/meta_data/gpt4_filtering.json

modelnet40:
  test_split: /mnt/disk1/souhail_data/meta_data/modelnet40/test_split.json
  test_pc: /mnt/disk1/souhail_data/meta_data/modelnet40/test_pc.npy
  num_points: 10000 
  num_workers: 0
  test_batch_size: 100
  clip_feat_path: /mnt/disk1/souhail_data/meta_data/modelnet40/cat_name_pt_feat.npy
  y_up: True

objaverse_lvis:
    split: /mnt/disk1/souhail_data/meta_data/split/lvis.json
    clip_feat_path: /mnt/disk1/souhail_data/meta_data/lvis_cat_name_pt_feat.npy
    num_points: 10000 
    num_workers: 6
    batch_size: 100
    y_up: True
    normalize: True
    use_color: True

scanobjectnn:
  data_path: /mnt/disk1/souhail_data/meta_data/scanobjectnn/xyz_label.npy
  num_points: 10000
  num_workers: 0
  test_batch_size: 100
  clip_feat_path: /mnt/disk1/souhail_data/meta_data/scanobjectnn/cat_name_pt_feat.npy
  y_up: True
  